<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI Chatbot</title>
    <!-- External Libraries -->
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.8.0/highlight.min.js"></script>
    <style>
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
            background-color: #000000;
            color: #ffffff;
            margin: 0;
            display: flex;
            height: 100vh;
        }

        #sidebar {
            width: 260px;
            background-color: #000000;
            display: flex;
            flex-direction: column;
            padding: 10px;
            flex-shrink: 0;
            border-right: 1px solid #1a1a1a;
            transition: width 0.3s cubic-bezier(0.4, 0, 0.2, 1), padding 0.3s cubic-bezier(0.4, 0, 0.2, 1), border-color 0.3s ease;
            overflow: hidden;
        }

        #sidebar.collapsed {
            width: 0;
            min-width: 0;
            padding-left: 0;
            padding-right: 0;
            border-right-color: transparent;
            overflow: hidden;
        }

        .sidebar-header {
            display: flex;
            gap: 8px;
            margin-bottom: 20px;
            align-items: center;
            width: 100%;
        }

        #new-chat-btn {
            border: 1px solid #ffffff;
            border-radius: 5px;
            padding: 12px;
            color: white;
            background: transparent;
            cursor: pointer;
            text-align: left;
            flex: 1;
            display: flex;
            align-items: center;
            gap: 10px;
            transition: all 0.3s ease;
            min-width: 0;
        }

        #new-chat-btn .btn-text {
            overflow: hidden;
            text-overflow: ellipsis;
            white-space: nowrap;
        }

        #new-chat-btn:hover {
            background-color: #ffffff;
            color: #000000;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
            border-color: #ffffff;
        }

        .sidebar-toggle-btn {
            border: 1px solid #262626;
            border-radius: 5px;
            padding: 12px;
            color: #a3a3a3;
            background: transparent;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s ease;
            flex-shrink: 0;
        }

        .sidebar-toggle-btn:hover {
            border-color: #ffffff;
            color: #ffffff;
            box-shadow: 0 0 12px rgba(255, 255, 255, 0.6);
        }

        .header-toggle-btn {
            padding: 8px;
            border-color: #262626;
        }

        .header-bar {
            display: flex;
            align-items: center;
            padding: 12px 24px;
            background-color: rgba(0, 0, 0, 0.8);
            border-bottom: 1px solid #1a1a1a;
            backdrop-filter: blur(10px);
            z-index: 10;
        }

        #history-list {
            flex: 1;
            overflow-y: auto;
            display: flex;
            flex-direction: column;
            gap: 5px;
        }

        .history-item {
            padding: 10px;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            color: #a3a3a3;
            display: flex;
            justify-content: space-between;
            align-items: center;
            transition: all 0.2s ease;
            border-left: 2px solid transparent;
        }

        .history-item:hover {
            background-color: #1a1a1a;
            color: #ffffff;
        }

        .history-item.active {
            background-color: #262626;
            color: #ffffff;
            border-left-color: #ffffff;
            box-shadow: inset 0 0 8px rgba(255, 255, 255, 0.05);
        }

        #main-content {
            flex: 1;
            display: flex;
            flex-direction: column;
            background-color: #0a0a0a;
            position: relative;
        }

        #chat-container {
            flex: 1;
            overflow-y: auto;
            padding: 20px 0;
            display: flex;
            flex-direction: column;
            align-items: center;
        }

        .message-wrapper {
            width: 100%;
            display: flex;
            justify-content: center;
            padding: 25px 0;
            border-bottom: 1px solid #141414;
        }

        .user-message-wrapper { background-color: #0a0a0a; }
        .ai-message-wrapper { background-color: #121212; }

        .message-content {
            max-width: 800px;
            width: 90%;
            display: flex;
            gap: 20px;
            font-size: 16px;
            line-height: 1.5;
        }

        .avatar {
            width: 30px; height: 30px; border-radius: 4px;
            display: flex; align-items: center; justify-content: center;
            font-weight: bold; flex-shrink: 0;
            font-size: 12px;
        }

        .user-avatar {
            background-color: #ffffff;
            color: #000000;
            border: 1px solid #ffffff;
        }
        
        .ai-avatar {
            background-color: #000000;
            color: #ffffff;
            border: 1px solid #ffffff;
            box-shadow: 0 0 8px rgba(255, 255, 255, 0.7);
        }

        .text { white-space: pre-wrap; word-break: break-word; }

        #input-container {
            padding: 20px;
            background-image: linear-gradient(180deg, rgba(10, 10, 10, 0), #0a0a0a 50%);
            display: flex; justify-content: center;
        }

        #input-form {
            max-width: 800px; width: 90%;
            position: relative; background-color: #000000;
            border-radius: 12px; padding: 10px 15px;
            display: flex; align-items: center;
            border: 1px solid #262626;
            box-shadow: 0 0 15px rgba(0,0,0,0.5);
            transition: all 0.3s ease;
        }

        #input-form:focus-within, #input-form:hover {
            border-color: #ffffff;
            box-shadow: 0 0 15px rgba(255, 255, 255, 0.4);
        }

        #user-input {
            width: 100%; background: transparent; border: none;
            color: white; font-size: 16px; outline: none;
            resize: none; max-height: 200px; padding: 5px;
        }

        #send-btn {
            background-color: transparent; border: none;
            color: #acacbe; cursor: pointer; padding: 5px;
        }

        #send-btn:disabled { opacity: 0.3; }

        /* Delete button styling */
        .delete-btn {
            background: transparent;
            border: none;
            color: #acacbe;
            cursor: pointer;
            padding: 2px;
            display: none;
            align-items: center;
            justify-content: center;
            transition: color 0.2s;
        }

        .delete-btn:hover {
            color: #ff4d4f;
        }

        .history-item:hover .delete-btn {
            display: flex;
        }
    </style>
</head>
<body>

    <div id="sidebar">
        <div class="sidebar-header">
            <button id="new-chat-btn">
                <span>+</span>
                <span class="btn-text">New chat</span>
            </button>
            <button class="sidebar-toggle-btn" onclick="toggleSidebar(true)" title="Close sidebar">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="16" width="16" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <path d="M17 16l-4-4 4-4"></path>
                </svg>
            </button>
        </div>
        <div id="history-list">
            <!-- History items will be injected here -->
        </div>
    </div>

    <div id="main-content">
        <div class="header-bar" id="header-bar" style="display: none;">
            <button class="sidebar-toggle-btn header-toggle-btn" onclick="toggleSidebar(false)" title="Open sidebar">
                <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="16" width="16" xmlns="http://www.w3.org/2000/svg">
                    <rect x="3" y="3" width="18" height="18" rx="2" ry="2"></rect>
                    <line x1="9" y1="3" x2="9" y2="21"></line>
                    <path d="M13 8l4 4-4 4"></path>
                </svg>
            </button>
        </div>
        <div id="chat-container"></div>
        <div id="input-container">
            <form id="input-form">
                <textarea id="user-input" placeholder="Send a message..." rows="1"></textarea>
                <button type="submit" id="send-btn" disabled>
                    <svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="20" width="20" xmlns="http://www.w3.org/2000/svg"><line x1="22" y1="2" x2="11" y2="13"></line><polygon points="22 2 15 22 11 13 2 9 22 2"></polygon></svg>
                </button>
            </form>
        </div>
    </div>

    <script>
        const chatContainer = document.getElementById('chat-container');
        const historyList = document.getElementById('history-list');
        const inputForm = document.getElementById('input-form');
        const userInput = document.getElementById('user-input');
        const sendBtn = document.getElementById('send-btn');
        const newChatBtn = document.getElementById('new-chat-btn');

        let currentSessionId = null;

        async function loadSessions() {
            const res = await fetch('/api/sessions');
            const sessions = await res.json();
            historyList.innerHTML = '';
            sessions.forEach(session => {
                const item = document.createElement('div');
                item.className = 'history-item';
                if (session.id === currentSessionId) item.classList.add('active');
                
                const textSpan = document.createElement('span');
                textSpan.className = 'history-text';
                textSpan.innerText = session.title;
                textSpan.onclick = () => loadSession(session.id);
                
                const delBtn = document.createElement('button');
                delBtn.className = 'delete-btn';
                delBtn.innerHTML = '<svg stroke="currentColor" fill="none" stroke-width="2" viewBox="0 0 24 24" stroke-linecap="round" stroke-linejoin="round" height="14" width="14" xmlns="http://www.w3.org/2000/svg"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6v14a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2V6m3 0V4a2 2 0 0 1 2-2h4a2 2 0 0 1 2 2v2"></path><line x1="10" y1="11" x2="10" y2="17"></line><line x1="14" y1="11" x2="14" y2="17"></line></svg>';
                delBtn.onclick = (e) => {
                    e.stopPropagation();
                    deleteSession(session.id);
                };
                
                item.appendChild(textSpan);
                item.appendChild(delBtn);
                historyList.appendChild(item);
            });
        }

        async function deleteSession(sessionId) {
            if (!confirm('Are you sure you want to delete this conversation?')) return;
            
            const res = await fetch(`/api/sessions/${sessionId}`, { method: 'DELETE' });
            if (res.ok) {
                if (currentSessionId === sessionId) {
                    currentSessionId = null;
                    chatContainer.innerHTML = '';
                }
                loadSessions();
            }
        }

        async function loadSession(sessionId) {
            currentSessionId = sessionId;
            chatContainer.innerHTML = '';
            const res = await fetch(`/api/sessions/${sessionId}`);
            const data = await res.json();
            data.messages.forEach(msg => {
                appendMessage(msg.role === 'user' ? 'user' : 'ai', msg.content);
            });
            loadSessions(); // refresh active state
        }

        newChatBtn.onclick = () => {
            currentSessionId = null;
            chatContainer.innerHTML = '';
            loadSessions();
        };

        userInput.addEventListener('input', () => {
            userInput.style.height = 'auto';
            userInput.style.height = userInput.scrollHeight + 'px';
            sendBtn.disabled = !userInput.value.trim();
        });

        userInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter' && !e.shiftKey) {
                e.preventDefault();
                inputForm.dispatchEvent(new Event('submit'));
            }
        });

        function appendMessage(role, text = '') {        
            const wrapper = document.createElement('div');
            wrapper.className = `message-wrapper ${role}-message-wrapper`;
            const content = document.createElement('div');
            content.className = 'message-content';  
            const avatar = document.createElement('div');
            avatar.className = `avatar ${role}-avatar`;
            avatar.innerText = role === 'user' ? 'U' : 'AI';
            const textDiv = document.createElement('div');
            textDiv.className = 'text';
            textDiv.innerText = text;
            content.appendChild(avatar);
            content.appendChild(textDiv);
            wrapper.appendChild(content);
            chatContainer.appendChild(wrapper);     
            chatContainer.scrollTop = chatContainer.scrollHeight;
            return textDiv;
        }

        // Configure marked to use highlight.js
        marked.setOptions({
            highlight: function(code, lang) {
                if (lang && hljs.getLanguage(lang)) {
                    return hljs.highlight(code, { language: lang }).value;
                }
                return hljs.highlightAuto(code).value;
            },
            breaks: true
        });

        inputForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const message = userInput.value.trim(); 
            if (!message) return;

            const userTextDiv = appendMessage('user');
            userTextDiv.innerText = message; 

            userInput.value = '';
            userInput.style.height = 'auto';        
            sendBtn.disabled = true;

            const aiTextDiv = appendMessage('ai'); 
            let accumulatedText = '';

            try {
                const response = await fetch('/api/chat', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ message: message, session_id: currentSessionId })
                });

                if (!currentSessionId) {
                    currentSessionId = response.headers.get('X-Session-ID');
                }

                const reader = response.body.getReader();
                const decoder = new TextDecoder();
                while (true) {
                    const { done, value } = await reader.read();
                    if (done) break;
                    accumulatedText += decoder.decode(value, { stream: true });
                    aiTextDiv.innerHTML = marked.parse(accumulatedText);
                    
                    // Highlight blocks as they complete or change
                    aiTextDiv.querySelectorAll('pre code').forEach((el) => {
                        hljs.highlightElement(el);
                    });

                    chatContainer.scrollTop = chatContainer.scrollHeight;
                }
                loadSessions(); // Refresh sidebar titles
            } catch (error) {
                aiTextDiv.innerText = 'Error: Could not connect to the server.';
            }
        });

        function toggleSidebar(collapse) {
            const sidebar = document.getElementById('sidebar');
            const headerBar = document.getElementById('header-bar');
            if (collapse) {
                sidebar.classList.add('collapsed');
                headerBar.style.display = 'block';
            } else {
                sidebar.classList.remove('collapsed');
                headerBar.style.display = 'none';
            }
        }

        loadSessions();
    </script>
</body>
</html>
